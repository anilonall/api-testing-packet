name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    attributes: { label: What happened?, description: Include clear reproduction steps. }
    validations: { required: true }
  - type: textarea
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: input
    attributes: { label: Version or commit }
    validations: { required: true }
  - type: textarea
    attributes: { label: Environment, description: OS, browser, .NET/Node versions, and deployment mode. }
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: I removed credentials, tokens, and private response data.
          required: true
